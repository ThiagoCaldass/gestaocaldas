<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa de Jiu-Jitsu</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style id="css">:root{--bg:#f4f2ee;--card:#fff;--ink:#1b1d22;--mut:#6b6f78;--line:#e3e0da;--acc:#1f3b8a;--acc2:#e8edfb;--fin:#b3261e;--finbg:#fbe9e7;--mov:#1f6f43;--movbg:#e6f4ec;--thr:#8a5a00;--thrbg:#fdf3dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.3px;margin:0}
button{font:inherit;cursor:pointer}
header{display:flex;gap:12px;align-items:center;padding:12px 18px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
header h1{font-size:24px;font-weight:700;white-space:nowrap}
header h1 span{color:#9fb4ff}
#q{flex:1;max-width:360px;padding:8px 12px;border-radius:8px;border:0;font:inherit}
#savebar{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px}
#savebar button{background:#9fb4ff;color:var(--ink);border:0;border-radius:8px;padding:7px 12px;font-weight:600}
.wrap{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 56px)}
nav{border-right:1px solid var(--line);padding:14px 10px;background:#ebe8e2}
nav h3{font-size:13px;text-transform:uppercase;color:var(--mut);margin:14px 8px 6px;font-family:Inter,sans-serif;letter-spacing:.6px}
nav button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:7px;color:var(--ink)}
nav button:hover{background:#ddd9d1}
nav button.on{background:var(--ink);color:#fff}
nav .cnt{font-size:12px;opacity:.6}
#navsel{display:none}
main{padding:20px 26px 60px;max-width:1100px}
.trail{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--mut)}
.trail button{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:13px}
.trail button:last-child{background:var(--acc2);border-color:#c8d3f4;color:var(--acc);font-weight:600}
.ptitle{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ptitle h2{font-size:38px;line-height:1}
.desc{color:var(--mut);margin:6px 0 16px;max-width:720px}
.sides{display:inline-flex;background:#ddd9d1;border-radius:10px;padding:3px;margin-bottom:18px}
.sides button{border:0;background:none;padding:8px 16px;border-radius:8px;font-weight:600;color:var(--mut)}
.sides button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col h3{font-size:20px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.col h3 .n{font-family:Inter;font-size:12px;background:var(--line);border-radius:10px;padding:1px 8px;color:var(--mut)}
.item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.item.fin{border-left-color:var(--fin)}
.item.mov{border-left-color:var(--mov)}
.item.thr{border-left-color:var(--thr);background:#fffdf8}
.item .row{display:flex;gap:8px;align-items:flex-start}
.item .row b{flex:1}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
.t-fin{background:var(--finbg);color:var(--fin)}
.t-mov{background:var(--movbg);color:var(--mov)}
.t-thr{background:var(--thrbg);color:var(--thr)}
.item p{margin:6px 0 0;font-size:14px}
.item .k{color:#33363d}
.item .d{color:var(--mut)}
.item .d em{font-style:normal;font-weight:600;color:var(--thr)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.go{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:5px 10px;font-size:13px;font-weight:600}
.go.alt{background:var(--card);color:var(--acc);border:1px solid #c8d3f4}
.st{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:2px 9px;font-size:12px;color:var(--mut)}
.st.s1{background:#fff4d6;border-color:#f0d78c;color:#7a5a00}
.st.s2{background:#e0ecff;border-color:#b6ccf5;color:#1f3b8a}
.st.s3{background:#dff3e6;border-color:#a9dcbc;color:#1f6f43}
.lnk{background:none;border:0;color:var(--mut);font-size:12px;text-decoration:underline;padding:0 2px}
.empty{color:var(--mut);font-size:14px;padding:8px 0}
.threats{margin-top:22px}
.threats>h3{font-size:22px;margin-bottom:4px}
.threats>p{color:var(--mut);margin:0 0 10px;font-size:14px}
.notes{margin-top:22px}
.notes textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--card)}
.addbtn{background:none;border:1px dashed #b9b4aa;border-radius:10px;width:100%;padding:8px;color:var(--mut)}
form.ed{background:var(--card);border:1px solid #c8d3f4;border-radius:10px;padding:12px;margin-bottom:10px;display:grid;gap:8px}
form.ed label{font-size:12px;color:var(--mut);display:grid;gap:3px}
form.ed input,form.ed textarea,form.ed select{font:inherit;border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%}
form.ed .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form.ed .btns{display:flex;gap:8px}
form.ed .btns button{border-radius:7px;padding:6px 12px;border:1px solid var(--line);background:var(--bg)}
form.ed .btns button[type=submit]{background:var(--acc);color:#fff;border-color:var(--acc)}
.prog{font-size:13px;color:var(--mut);margin-left:auto}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;width:140px;display:inline-block;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%;background:var(--mov)}
.res h3{font-size:16px;margin:16px 0 6px;color:var(--mut)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;font-size:14px;z-index:9}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  nav{display:none}
  #navsel{display:block;width:100%;padding:9px;border-radius:9px;border:1px solid var(--line);font:inherit;margin-bottom:12px;background:var(--card)}
  .grid{grid-template-columns:1fr}
  main{padding:14px}
  header{flex-wrap:wrap}
  header h1{font-size:20px}
  #q{max-width:none;order:3;flex-basis:100%}
  .ptitle h2{font-size:30px}
}

.ath{margin-top:6px;display:flex;gap:8px;align-items:center;font-size:12px}
.ath a{color:var(--mut)}
.atl{background:#efe9ff;color:#4b2e9a;border:1px solid #d9ccff;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600}
.item.dica{border-left-color:#6b4bd8;background:#fbf9ff}
.t-dica{background:#efe9ff;color:#4b2e9a}
.dicas{margin-bottom:18px}
h2.big{font-size:34px;margin-bottom:2px}
h3.sec{font-size:22px;margin:24px 0 10px;display:flex;align-items:baseline;gap:10px}
h3.sec small,h3.sub small{font-family:Inter;font-size:13px;color:var(--mut);font-weight:400}
h3.sub{font-size:20px;margin-bottom:8px}
.bdg{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.nv{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px}
.nv1{background:#e6f4ec;color:#1f6f43}.nv2{background:#e0ecff;color:#1f3b8a}.nv3{background:#f3e3ff;color:#6a2a9a}
.proib{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:#fde2e0;color:#b3261e}
.item p.pr{color:#b3261e;font-size:13px}
details.passos{margin-top:8px;background:var(--bg);border-radius:8px;padding:6px 10px}
details.passos summary{cursor:pointer;font-weight:600;color:var(--acc);font-size:14px}
details.passos ol{margin:8px 0 4px 18px;padding:0;font-size:14px}
details.passos li{margin-bottom:3px}
.er-t{font-weight:700;font-size:13px;color:#b3261e;margin:8px 0 2px!important}
ul.erros{margin:0 0 4px 18px;padding:0;font-size:13px;color:#5c2a26}
.actions-big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.actions-big button{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:16px;text-align:left;font-size:18px;font-weight:700;font-family:"Barlow Condensed",Inter}
.actions-big small{display:block;font-family:Inter;font-size:13px;font-weight:400;opacity:.75;margin-top:4px}
.filtros{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}
.filtros select{font:inherit;padding:3px 6px;border-radius:6px;border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:grid;gap:4px}
.pcard:hover{border-color:#c8d3f4}
.pcard b{font-size:16px}.pcard span{font-size:13px;color:var(--mut)}.pcard small{font-size:12px;color:var(--mut)}
.pcard .bar{width:100%;margin:4px 0 0}
.jogo-ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
.como{margin-top:26px;background:#fffdf3;border:1px solid #efe3b5;border-radius:12px;padding:12px 16px}
.como h3{font-size:20px}.como ol{margin:6px 0 0 18px;padding:0;font-size:14px}.como li{margin-bottom:4px}
.radios{display:flex;flex-wrap:wrap;gap:14px;font-size:14px}
.radios label{display:flex!important;align-items:center;gap:5px;color:var(--ink)!important;font-size:14px!important}
.radios input{width:auto!important}
.resposta{background:#f3f6ff;border:1px solid #c8d3f4;border-radius:12px;padding:14px;margin:16px 0}
.resposta h3{font-size:24px;margin-bottom:6px}
.resposta h4{margin:14px 0 6px;font-size:15px;text-transform:uppercase;letter-spacing:.5px;color:var(--acc)}
.reglog{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--thr);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.reglog.ok{opacity:.55;border-left-color:var(--mov)}
.reglog span{color:var(--mut)}.reglog i{color:#33363d}
.rl-acts{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.foco{display:grid;gap:5px;font-size:14px;max-height:280px;overflow:auto;background:var(--bg);border-radius:8px;padding:8px}
.foco label{display:flex!important;gap:6px;align-items:center;color:var(--ink)!important;font-size:14px!important}
.foco input{width:auto!important}
.plano{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden}
.pl-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.plano pre{margin:0;padding:14px;white-space:pre-wrap;font:14px/1.5 Inter,system-ui,sans-serif}
.warn{background:var(--thrbg);color:var(--thr);border-radius:8px;padding:7px 12px;font-size:14px}
.hid{font-size:13px;color:var(--mut);margin:-8px 0 14px}
@media (max-width:820px){.actions-big{grid-template-columns:1fr}.reglog{flex-direction:column}.rl-acts{flex-direction:row;align-items:center}}

.perfil{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;margin:8px 0 10px}
.perfil label{display:flex;gap:6px;align-items:center}
.perfil select{font:inherit;padding:3px 6px;border-radius:6px;border:1px solid var(--line)}
details.regras{background:#fff6f5;border:1px solid #f3cfcb;border-radius:10px;padding:8px 14px;margin-bottom:10px;font-size:14px}
details.regras summary{cursor:pointer;font-weight:700;color:#8a1f18}
details.regras p{margin:8px 0}
details.regras .src{font-size:12px;color:var(--mut)}
.gionly{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:#eef0f3;color:#4a5160}
.hint{font-size:12px;color:var(--mut)}
nav small{opacity:.6;font-size:11px}

e controle da cabeça.","nv":2},{"n":"Arm drag para queda ou costas","t":"avanço","p":"costas","l":"a","at":"Marcelo Garcia","src":"https://www.grapplearts.com/?p=17215","k":"Puxe o braço cruzando, entre a rasteira por dentro ou passe para trás.","d":"Tire o braço cedo e gire de frente.","nv":1}],"dicas":[]},"b":{"label":"Defendendo","fin":[{"n":"Guilhotina (contra a entrada de queda)","k":"Ele entra com a cabeça baixa: envolva o pescoço, sprawl e puxe.","d":"Cabeça alinhada e postura na entrada; se pegar, passe para o lado do braço.","nv":1}],"mov":[{"n":"Sprawl e girar por trás","t":"avanço","p":"tartaruga","l":"a","k":"Quadril pesado no ombro dele, pernas para trás, gire para as costas.","d":"Recomece a entrada ou puxe uma perna.","nv":1},{"n":"Puxar para a guarda","t":"puxada","p":"guarda-fechada","l":"b","k":"Com pegada, sente perto e feche as pernas.","d":"Postura e base.","nv":1},{"n":"Sprawl para gravata frontal","t":"avanço","p":"gravata-frontal","l":"a","k":"Defenda a queda e prenda a cabeça.","d":"","nv":1}],"dicas":[]}},{"id":"guarda-fechada","n":"Guarda fechada","g":"Guardas","desc":"Pernas cruzadas na cintura. Quem está por baixo quebra a postura; quem está por cima mantém postura e abre.","a":{"label":"Dentro da guarda (por cima)","fin":[{"n":"Chave de pé reta (depois de abrir)","k":"Pé dele na sua axila, antebraço no tendão de Aquiles, caia para o mesmo lado da perna.","d":"Pé fora da axila, avance o quadril, gire o pé para fora do lado da pegada.","nv":2}],"mov":[{"n":"Abrir a guarda em pé","t":"avanço","p":"guarda-aberta","l":"a","k":"Postura alta, mãos no quadril dele, levante com um pé de cada vez e empurre o joelho para baixo.","d":"Pegue o tornozelo para raspar, ou ataque guarda aberta assim que abrir.","nv":1},{"n":"Abrir de joelhos e passar cortando o joelho","t":"passagem","p":"cem-quilos","l":"a","k":"Joelho no cóccix, abra a perna, corte o joelho por cima da coxa dele com o ombro baixo.","d":"Frame no quadril e pescoço, fuga de quadril ou m ['jogo','fugas'].forEach(function(k){ DATA.perfil[k] = (DATA.perfil[k]||[]).map(function(e){ return e.indexOf('|')>-1 ? e : e+'|b'; }); });
function slug(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
DATA.posicoes.forEach(function(p){ ['a','b'].forEach(function(l){ p[l].dicas = p[l].dicas||[]; ['fin','mov'].forEach(function(k){ p[l][k].forEach(function(it){ if(!it.id) it.id = p.id+'-'+l+'-'+k+'-'+slug(it.n); }); }); }); });

function P(id){ for (var i=0;i<DATA.posicoes.length;i++) if (DATA.posicoes[i].id===id) return DATA.posicoes[i]; return null; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function other(l){ return l==='a'?'b':'a'; }
function today(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function fmtDate(s){ var x=String(s||'').split('-'); return x.length===3? x[2]+'/'+x[1] : s; }
function visible(it){ if (showAll) return true; var pf=DATA.perfil; if ((it.nv||1) > (pf.nivelMax||3)) return false; if (pf.esconderProib && illegal(it)) return false; if (pf.modal==='No-gi' && it.gi) return false; return true; }
function findItem(id){ var r=null; DATA.posicoes.forEach(function(p){ ['a','b'].forEach(function(l){ ['fin','mov'].forEach(function(k){ p[l][k].forEach(function(it){ if(it.id===id) r={p:p,l:l,k:k,it:it}; }); }); }); }); return r; }

// ---------- rotas ----------
function readHash(){
  var h = location.hash.replace('#','');
  if (h==='inicio'||h==='treino'||h==='registro') return {v:h};
  var m = h.match(/^(.+)-(a|b)$/);
  if (m && P(m[1])) return {v:'pos', p:m[1], l:m[2]};
  return {v:'inicio'};
}
var cur = readHash();
function setHash(h){ if (location.hash !== '#'+h) history.replaceState(null,'','#'+h); }
function go(p,l,fromTrail){
  cur = {v:'pos', p:p, l:l}; editing = null; showAll = false; q=''; atl='';
  if (!fromTrail) { trail.push({p:p,l:l}); if (trail.length>14) trail = trail.slice(-14); }
  try { sessionStorage.setItem(LS+'-trail', JSON.stringify(trail)); } catch(e){}
  setHash(p+'-'+l); render(); window.scrollTo(0,0);
}
function view(v){ cur={v:v}; q=''; atl=''; editing=null; setHash(v); render(); window.scrollTo(0,0); }
window.addEventListener('hashchange', function(){ var h=readHash(); if (h.v==='pos') { if (cur.p!==h.p||cur.l!==h.l) go(h.p,h.l); } else if (h.v!==cur.v) view(h.v); });

function markDirty(){ dirty = true; DATA.savedAt = Date.now(); try { localStorage.setItem(LS, JSON.stringify(DATA)); } catch(e){} if (EMB){ EMB.salvar(DATA); dirty = false; } renderSave(); }
function toast(msg){ var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){t.remove();},2600); }

// ---------- salvar na própria página ----------
function buildDoc(){
  var json = JSON.stringify(DATA).replace(/</g,'\\u003c');
  var css = document.getElementById('css').textContent;
  var app = document.getElementById('app').textContent;
  return '<!DOCTYPE html>\n<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>Mapa de Jiu-Jitsu</title><link rel="preconnect" href="https://fonts.googleapis.com">'+
    '<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">'+
    '<style id="css">'+css+'</style></head><body><div id="root"></div>'+
    '<script type="application/json" id="data">'+json+'<\/script><script id="app">'+app+'<\/script></body></html>';
}
function save(){
  if (!canPublish){ toast('Salvo neste navegador.'); dirty=false; renderSave(); return; }
  var btn = document.getElementById('savebtn'); if (btn){ btn.disabled=true; btn.textContent='Salvando…'; }
  art.publish(buildDoc()).then(function(){ dirty=false; }).catch(function(e){
    var c = (e && (e.code||e.message)) || '';
    if (/not_granted|not_writer/.test(c)) { canPublish=false; toast('Sem permissão de edição. Salvo só neste navegador.'); dirty=false; }
    else if (/conflict/.test(c)) toast('A página mudou em outra aba. Recarregando.');
    else toast('Não foi possível salvar. Tente de novo.');
    renderSave();
  });
}
function renderSave(){
  var el = document.getElementById('savebar'); if (!el) return;
  el.innerHTML = dirty ? '<span>Alterações não salvas</span><button id="savebtn">Salvar</button>' : '<span style="opacity:.6">Tudo salvo</span>';
  var b = document.getElementById('savebtn'); if (b) b.onclick = save;
}
window.addEventListener('beforeunload', function(e){ if (dirty && canPublish){ e.preventDefault(); e.returnValue=''; } });

// ---------- auxiliares ----------
function progress(p, side){
  var tot=0, ok=0;
  ['a','b'].forEach(function(l){ if (side && l!==side) return; ['fin','mov'].forEach(function(k){ p[l][k].forEach(function(it){ if(!visible(it)) return; tot++; if ((DATA.status[it.id]||0)===3) ok++; }); }); });
  return {tot:tot, ok:ok};
}
function athletes(){ var o={}; DATA.posicoes.forEach(function(p){ ['a','b'].forEach(function(l){ ['fin','mov'].forEach(function(k){ p[l][k].forEach(function(it){ if(it.at) o[it.at]=(o[it.at]||0)+1; }); }); (p[l].dicas||[]).forEach(function(d){ if(d.at) o[d.at]=(o[d.at]||0)+1; }); }); }); return o; }
function fracos(){
  var c={};
  DATA.diario.forEach(function(r){ if (r.resolvido) return; var k=r.p+'|'+r.l; c[k]=(c[k]||0)+1; });
  return Object.keys(c).map(function(k){ var s=k.split('|'); return {p:s[0], l:s[1], n:c[k]}; }).filter(function(x){return P(x.p);}).sort(function(a,b){return b.n-a.n;});
}
function sideLabel(pid,l){ var p=P(pid); return p ? p.n+' · '+p[l].label : pid; }
function posOptions(sel){
  var groups={}; DATA.posicoes.forEach(function(p){ (groups[p.g]=groups[p.g]||[]).push(p); });
  return Object.keys(groups).map(function(g){ return '<optgroup label="'+esc(g)+'">'+groups[g].map(function(p){ return ['b','a'].map(function(l){ var v=p.id+'|'+l; return '<option value="'+v+'"'+(v===sel?' selected':'')+'>'+esc(p.n)+' — '+esc(p[l].label)+'</option>'; }).join(''); }).join('')+'</optgroup>'; }).join('');
}

// ---------- itens ----------
function badges(it){
  var h = '<span class="nv nv'+(it.nv||1)+'" title="Nível">'+NV_LABEL[it.nv||1]+'</span>';
  var il = illegal(it); if (il) h += '<span class="proib" title="'+esc(il)+'">Proibido na '+esc((DATA.perfil.faixa||'').toLowerCase())+'</span>';
  if (it.gi) h += '<span class="gionly">só gi</span>';
  return h;
}
function passosHTML(it){
  if (!it.passos) return '';
  return '<details class="passos"><summary>Passo a passo</summary><ol>'+it.passos.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ol>'+
    (it.erros&&it.erros.length?'<p class="er-t">Erros comuns</p><ul class="erros">'+it.erros.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul>':'')+'</details>';
}
function itemHTML(it, kind, p, l, mode){
  var s = DATA.status[it.id]||0;
  var tag = mode==='thr' ? (kind==='fin'?'Finalização dele':(it.t||'movimento')+' dele') : (kind==='fin'?'Finalização':(it.t||'movimento'));
  var cls = mode==='thr' ? 'thr' : kind;
  var h = '<div class="item '+cls+'"><div class="row"><span class="tag t-'+(mode==='thr'?'thr':kind)+'">'+esc(tag)+'</span><b>'+esc(it.n)+'</b>'+
    '<button class="st s'+s+'" data-st="'+it.id+'" title="Clique para mudar">'+ST_LABEL[s]+'</button></div>'+
    '<div class="bdg">'+badges(it)+'</div>';
  if (mode==='thr'){
    h += '<p class="d"><em>Como defender:</em> '+(it.d?esc(it.d):'sem anotação ainda.')+'</p>';
  } else {
    if (it.k) h += '<p class="k">'+esc(it.k)+'</p>';
    if (it.d) h += '<p class="d"><em>Reação dele:</em> '+esc(it.d)+'</p>';
    h += passosHTML(it);
  }
  var il2 = illegal(it); if (il2) h += '<p class="d pr">IBJJF, faixa '+esc((DATA.perfil.faixa||'').toLowerCase())+' '+(DATA.perfil.modal==='No-gi'?'no-gi':'gi')+(DATA.perfil.master?' master':'')+': '+esc(il2)+' é proibido.</p>';
  if (it.at) h += '<div class="ath"><button class="atl" data-atl="'+esc(it.at)+'">'+esc(it.at)+'</button>'+(it.src?' <a href="'+esc(it.src)+'" target="_blank" rel="noopener">fonte</a>':'')+'</div>';
  if (it.video) h += '<div class="ath"><a href="'+esc(it.video)+'" target="_blank" rel="noopener">▶ vídeo</a></div>';
  h += '<div class="acts">';
  if (kind==='mov' && P(it.p)){
    var tl = mode==='thr' ? other(it.l) : it.l;
    if (!(mode!=='thr' && it.p===p.id && tl===l)){
      h += '<button class="go'+(mode==='thr'?' alt':'')+'" data-go="'+it.p+'|'+tl+'">'+(mode==='thr'?'Se ele conseguir: ':'Avançar → ')+esc(sideLabel(it.p,tl))+'</button>';
    }
  }
  if (mode!=='thr') h += '<button class="lnk" data-edit="'+p.id+'|'+l+'|'+kind+'|'+it.id+'">editar</button>';
  h += '</div></div>';
  return h;
}
function dicaHTML(d, where){
  return '<div class="item dica"><div class="row"><span class="tag t-dica">Conceito</span><b>'+esc(d.n)+'</b></div>'+(where?'<p class="d">'+esc(where)+'</p>':'')+'<p class="k">'+esc(d.k)+'</p>'+
    (d.at?'<div class="ath"><button class="atl" data-atl="'+esc(d.at)+'">'+esc(d.at)+'</button>'+(d.src?' <a href="'+esc(d.src)+'" target="_blank" rel="noopener">fonte</a>':'')+'</div>':'')+'</div>';
}
function formHTML(p, l, kind, it){
  it = it || {};
  var opts = DATA.posicoes.map(function(x){ return '<option value="'+x.id+'"'+(x.id===it.p?' selected':'')+'>'+esc(x.n)+'</option>'; }).join('');
  var types = ['raspagem','passagem','fuga','avanço','queda','puxada','transição'];
  var h = '<form class="ed" data-form="'+p.id+'|'+l+'|'+kind+'|'+(it.id||'')+'">'+
    '<label>Nome<input name="n" required value="'+esc(it.n)+'"></label>'+
    '<div class="two"><label>Nível<select name="nv">'+[1,2,3].map(function(n){return '<option value="'+n+'"'+((it.nv||1)===n?' selected':'')+'>'+NV_LABEL[n]+'</option>';}).join('')+'</select></label>'+
    '<label>Link de vídeo (opcional)<input name="video" value="'+esc(it.video)+'" placeholder="https://"></label></div>'+
    '<div class="two"><label>Atleta (opcional)<input name="at" value="'+esc(it.at)+'"></label><label>Link da fonte (opcional)<input name="src" value="'+esc(it.src)+'"></label></div>'+
    '<label>Detalhe-chave<textarea name="k" rows="2">'+esc(it.k)+'</textarea></label>'+
    '<label>Passo a passo (um passo por linha)<textarea name="passos" rows="4">'+esc((it.passos||[]).join('\n'))+'</textarea></label>'+
    '<label>Erros comuns (um por linha)<textarea name="erros" rows="2">'+esc((it.erros||[]).join('\n'))+'</textarea></label>'+
    '<label>'+(kind==='fin'?'Defesa (o que o oponente faz)':'Reação/contra do oponente')+'<textarea name="d" rows="2">'+esc(it.d)+'</textarea></label>';
  if (kind==='mov'){
    h += '<div class="two"><label>Tipo<select name="t">'+types.map(function(t){return '<option'+(t===it.t?' selected':'')+'>'+t+'</option>';}).join('')+'</select></label>'+
      '<label>Leva para<select name="p">'+opts+'</select></label></div>'+
      '<label>Você termina<select name="l"><option value="a"'+(it.l!=='b'?' selected':'')+'>por cima / dominante</option><option value="b"'+(it.l==='b'?' selected':'')+'>por baixo</option></select></label>';
  }
  h += '<div class="btns"><button type="submit">Salvar técnica</button><button type="button" data-cancel>Cancelar</button>'+
    (it.id?'<button type="button" data-del="'+it.id+'" style="margin-left:auto;color:#b3261e">Excluir</button>':'')+'</div></form>';
  return h;
}
function colHTML(p, l, kind, title){
  var all = p[l][kind], list = all.filter(visible);
  var h = '<div class="col"><h3>'+title+' <span class="n">'+list.length+'</span></h3>';
  if (!list.length) h += '<div class="empty">Nada no seu nível.</div>';
  list.forEach(function(it){ h += (editing && editing.id===it.id) ? formHTML(p,l,kind,it) : itemHTML(it, kind, p, l, 'own'); });
  if (editing && editing.id==='' && editing.kind===kind && editing.p===p.id && editing.l===l) h += formHTML(p,l,kind,null);
  else h += '<button class="addbtn" data-add="'+p.id+'|'+l+'|'+kind+'">+ adicionar '+(kind==='fin'?'finalização':'movimento')+'</button>';
  return h+'</div>';
}

// ---------- navegação lateral ----------
function renderNav(){
  var pf = DATA.perfil, h = '';
  h += '<button class="'+(cur.v==='inicio'?'on':'')+'" data-view="inicio"><span>🏠 Início</span></button>';
  h += '<button class="'+(cur.v==='registro'?'on':'')+'" data-view="registro"><span>📝 Pós-treino</span><span class="cnt">'+DATA.diario.filter(function(r){return !r.resolvido;}).length+'</span></button>';
  h += '<button class="'+(cur.v==='treino'?'on':'')+'" data-view="treino"><span>🎯 Treino da semana</span></button>';
  if (pf.jogo && pf.jogo.length){
    h += '<h3>Meu jogo</h3>';
    pf.jogo.forEach(function(e){ var x=e.split('|'), p=P(x[0]); if(p) h += '<button class="'+(cur.p===x[0]&&cur.l===x[1]&&cur.v==='pos'?'on':'')+'" data-nav="'+x[0]+'" data-navl="'+x[1]+'"><span>★ '+esc(p.n)+' <small>('+SIDE_WORD[x[1]]+')</small></span></button>'; });
  }
  var groups = {};
  DATA.posicoes.forEach(function(p){ (groups[p.g]=groups[p.g]||[]).push(p); });
  Object.keys(groups).forEach(function(g){
    h += '<h3>'+esc(g)+'</h3>';
    groups[g].forEach(function(p){ var pr=progress(p); h += '<button class="'+(p.id===cur.p&&cur.v==='pos'?'on':'')+'" data-nav="'+p.id+'"><span>'+esc(p.n)+(p.gi?' <small>(gi)</small>':'')+'</span><span class="cnt">'+pr.ok+'/'+pr.tot+'</span></button>'; });
  });
  h += '<h3>&nbsp;</h3><button data-newpos>+ nova posição</button>';
  var ats = athletes(); h += '<h3>Atletas</h3>';
  Object.keys(ats).sort().forEach(function(a){ h += '<button class="'+(a===atl?'on':'')+'" data-atl="'+esc(a)+'"><span>'+esc(a)+'</span><span class="cnt">'+ats[a]+'</span></button>'; });
  return h;
}

// ---------- telas ----------
function renderSearch(){
  var t = slug(q), out = [], dic = [];
  DATA.posicoes.forEach(function(p){ ['a','b'].forEach(function(l){ ['fin','mov'].forEach(function(k){ p[l][k].forEach(function(it){
    if (atl ? it.at===atl : slug(it.n+' '+(it.k||'')+' '+(it.at||'')).indexOf(t)>-1) out.push({p:p,l:l,k:k,it:it});
  }); }); if (atl) (p[l].dicas||[]).forEach(function(d){ if(d.at===atl) dic.push({p:p,l:l,d:d}); }); }); });
  var h = '<div class="res"><h2 class="big">'+(atl?esc(atl):'Busca: “'+esc(q)+'”')+'</h2><p class="desc">'+out.length+' técnica(s)'+(dic.length?' · '+dic.length+' conceito(s)':'')+' · a busca mostra todos os níveis</p>';
  dic.forEach(function(x){ h += dicaHTML(x.d, x.p.n+' · '+x.p[x.l].label); });
  var by = {};
  out.forEach(function(r){ var key=r.p.id+'|'+r.l; (by[key]=by[key]||[]).push(r); });
  Object.keys(by).forEach(function(key){
    var r0 = by[key][0];
    h += '<h3>'+esc(r0.p.n)+' · '+esc(r0.p[r0.l].label)+' <button class="go alt" data-go="'+key+'">abrir</button></h3>';
    by[key].forEach(function(r){ h += itemHTML(r.it, r.k, r.p, r.l, 'own'); });
  });
  return h+'</div>';
}

function cardPos(id, l, extra){
  var p=P(id); if(!p) return ''; var pr=progress(p,l);
  return '<button class="pcard" data-go="'+id+'|'+l+'"><b>'+esc(p.n)+'</b><span>'+esc(p[l].label)+'</span>'+
    '<span class="bar"><i style="width:'+(pr.tot?pr.ok/pr.tot*100:0)+'%"></i></span><small>'+pr.ok+'/'+pr.tot+' dominadas'+(extra?' · '+extra:'')+'</small></button>';
}

  if(at) it.at=at; if(/^https?:\/\//.test(src)) it.src=src; if(/^https?:\/\//.test(video)) it.video=video;
  var ps=lines(fd.get('passos')), er=lines(fd.get('erros')); if(ps.length) it.passos=ps; if(er.length) it.erros=er;
  if (!it.n) return;
  if (kind==='mov'){ it.t=fd.get('t'); it.p=fd.get('p'); it.l=fd.get('l'); }
  var list = p[l][kind];
  if (id){ for (var i=0;i<list.length;i++) if (list[i].id===id){ it.id=id; if(list[i].cls) it.cls=list[i].cls; if(list[i].gi) it.gi=list[i].gi; list[i]=it; break; } }
  else { it.id = 'c'+Date.now().toString(36); list.push(it); }
  editing=null; markDirty(); render();
});

function newPos(){
  var main = document.querySelector('main');
  main.innerHTML = '<h2 class="big">Nova posição</h2><form class="ed" id="np" style="max-width:520px">'+
    '<label>Nome<input name="n" required placeholder="ex: Guarda X"></label>'+
    '<label>Grupo<input name="g" list="gl" required placeholder="ex: Guardas"><datalist id="gl">'+Array.from(new Set(DATA.posicoes.map(function(p){return p.g;}))).map(function(g){return '<option value="'+esc(g)+'">';}).join('')+'</datalist></label>'+
    '<label>Descrição<textarea name="desc" rows="2"></textarea></label>'+
    '<div class="two"><label>Lado dominante<input name="la" value="Por cima"></label><label>Lado inferior<input name="lb" value="Por baixo"></label></div>'+
    '<div class="btns"><button type="submit">Criar</button><button type="button" data-cancel>Cancelar</button></div></form>';
  document.getElementById('np').onsubmit = function(e){
    e.preventDefault(); var fd = new FormData(e.target);
    var id = slug(fd.get('n')); if (P(id)) id += '-'+Date.now().toString(36);
    DATA.posicoes.push({id:id, n:fd.get('n').trim(), g:fd.get('g').trim(), desc:fd.get('desc').trim(), a:{label:fd.get('la').trim()||'Por cima', fin:[], mov:[], dicas:[]}, b:{label:fd.get('lb').trim()||'Por baixo', fin:[], mov:[], dicas:[]}});
    markDirty(); go(id,'a');
  };
}
